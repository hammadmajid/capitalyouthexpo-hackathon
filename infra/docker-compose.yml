name: hsm
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hsm}
      POSTGRES_USER: ${POSTGRES_USER:-hsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:1.5.4
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-signatures:/var/lib/clamav
    # Image healthcheck verifies clamd; production signature updates stay enabled.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
  storage:
    image: versity/versitygw:v1.8.0
    command: ['--port', ':9000', '--region', '${S3_REGION:-us-east-1}', 'posix', '/data']
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-hsm-development-access}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-hsm-development-only-secret}
    ports:
      - '127.0.0.1:${STORAGE_PORT:-9000}:9000'
    volumes:
      - storage-data:/data
  storage-init:
    image: amazon/aws-cli:2.31.16
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-hsm-development-access}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-hsm-development-only-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_MAX_ATTEMPTS: '2'
      S3_ENDPOINT: http://storage:9000
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-hsm-private}
    volumes:
      - ./storage/init.sh:/init/storage.sh:ro
      - ${S3_CORS_CONFIG:-./storage/cors.json}:/init/cors.json:ro
    entrypoint: ['/bin/sh', '/init/storage.sh']
volumes:
  postgres-data:
  redis-data:
  storage-data:
  clamav-signatures:
